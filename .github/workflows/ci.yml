name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — typecheck + lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @waste/backend typecheck
      - name: Lint
        run: pnpm --filter @waste/backend lint
      - name: Architecture boundaries
        run: pnpm --filter @waste/backend arch
      - name: Unit + property tests
        run: pnpm --filter @waste/backend test
      - name: Build
        run: pnpm --filter @waste/backend build

  backend-integration:
    name: Backend — DB integration + security + E2E (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waste_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/waste_test
      APP_ENV: test
      JWT_SECRET_KEY: ci-jwt-secret-0123456789abcdef0123456789
      IDENTITY_PEPPER: ci-pepper-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations from empty DB
        run: pnpm --filter @waste/backend db:migrate
      - name: Seed reference data
        run: pnpm --filter @waste/backend db:seed
      - name: Demo seed (test env)
        run: pnpm --filter @waste/backend db:seed:demo
      - name: Full E2E journey
        run: cd backend && npx tsx tests/e2e/full-journey.ts

  web:
    name: Web — typecheck + build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate API types from contract
        run: pnpm --filter @waste/web gen:api
      - name: Typecheck
        run: pnpm --filter @waste/web typecheck
      - name: Unit tests
        run: pnpm --filter @waste/web test
      - name: Build
        run: pnpm --filter @waste/web build

  contract:
    name: OpenAPI contract freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export and diff
        run: |
          cd backend
          DATABASE_URL="postgresql://placeholder" APP_ENV=development \
          JWT_SECRET_KEY=ci-jwt-secret-0123456789abcdef0123456789 \
          IDENTITY_PEPPER=ci-pepper-0123456789abcdef0123456789 \
          npx tsx src/cli.ts export-openapi /tmp/openapi-ci.json
          diff <(python3 -m json.tool /tmp/openapi-ci.json) <(python3 -m json.tool ../openapi.json) \
            || (echo "::error::openapi.json is stale — regenerate with pnpm --filter @waste/backend export-openapi" && exit 1)

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile -t waste-platform-ci .
      - name: Startup smoke (missing secrets must fail fast)
        run: |
          if docker run --rm waste-platform-ci 2>/dev/null; then
            echo "::error::app must fail fast without secrets"; exit 1
          else
            echo "OK: fail-fast verified (no default secrets)"
          fi
